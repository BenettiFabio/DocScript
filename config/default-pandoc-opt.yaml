# ----------------------------------------------------------------------
# ATTENZIONE: Questo file YAML deve contenere ESCLUSIVAMENTE
# opzioni da riga di comando di Pandoc (i.e. --option) e NON i percorsi
# a template o filtri Lua.
# Per template e filtri Lua, utilizza i comandi appositi della tua architettura.
# ----------------------------------------------------------------------

# Option to handle math blocks in different formats
from: markdown+tex_math_dollars+tex_math_single_backslash
# Option for handle first level titles like chapters
top-level-division: chapter
# Option to enable the 'listings' functionality for code formatting in LaTeX.
listings: true
pdf-engine: xelatex
